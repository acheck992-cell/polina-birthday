<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Polina! ✨💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #0f0c1b;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Full Screen Interactive Overlay */
        #startGate {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 12, 27, 0.98);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: #fffdf9;
            color: #1e1b2e;
            padding: 35px 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 4px solid #ffffff;
        }

        .play-btn {
            background: linear-gradient(135deg, #ff758c, #a855f7);
            color: #fff;
            border: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 8px 25px rgba(255, 117, 140, 0.4);
        }

        /* Scrapbook Page Layout */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 15px 80px 15px;
        }

        .section-box {
            background: #fdfbf7;
            color: #2d3748;
            border-radius: 18px;
            padding: 25px 18px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
        }

        .tape {
            position: absolute;
            top: -12px; left: 50%;
            transform: translateX(-50%) rotate(-1deg);
            width: 100px; height: 24px;
            background: rgba(255, 117, 140, 0.4);
            border: 1px dashed rgba(255,255,255,0.8);
        }

        /* Smooth Motion Video Reel */
        .marquee-box {
            overflow: hidden;
            width: 100%;
            background: #111;
            padding: 12px 0;
            border-radius: 10px;
            margin: 15px 0;
            border-top: 3px dashed #fff;
            border-bottom: 3px dashed #fff;
        }

        .marquee-track {
            display: flex;
            gap: 12px;
            width: max-content;
            animation: reelMove 18s linear infinite;
        }

        @keyframes reelMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .frame {
            width: 120px; height: 160px;
            background: #fff; padding: 5px;
            border-radius: 4px; flex-shrink: 0;
        }

        .frame img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* Photo Polaroid */
        .polaroid {
            background: #fff;
            padding: 10px 10px 25px 10px;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin: 15px auto;
            transform: rotate(var(--r));
        }

        .polaroid img {
            width: 100%; height: 250px;
            object-fit: cover;
        }

        .polaroid-text {
            font-family: 'Caveat', cursive;
            font-size: 22px;
            color: #334155;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Start Overlay (Unlocks Browser Audio Policy) -->
    <div id="startGate">
        <div class="card">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 32px; color: #be123c;">Happy Birthday!</h1>
            <h2 style="font-family: 'Caveat', cursive; font-size: 30px; color: #a855f7; margin-top: 5px;">Dear Polina 🌸✨</h2>
            <p style="font-size: 13px; color: #64748b; margin-top: 10px;">Tap below to begin the birthday story & song!</p>
            <button class="play-btn" onclick="openBirthdayPage()">START EXPERIENCE 🎵</button>
        </div>
    </div>

    <!-- Main Scrapbook Content -->
    <div class="container">

        <div class="section-box">
            <div class="tape"></div>
            <h1 style="font-family: 'Caveat', cursive; font-size: 36px; color: #be123c;">For Polina ✨</h1>
            <p style="font-size: 13.5px; color: #64748b; line-height: 1.5; margin-top: 8px;">
                Wishing you the most magical birthday ever! Here is a digital journal of memories.
            </p>
        </div>

        <!-- Motion Reel Section -->
        <div class="section-box">
            <div class="tape"></div>
            <h3 style="font-family: 'Caveat', cursive; font-size: 26px; color: #a855f7;">Smooth Memory Reel 🎞️</h3>
            
            <div class="marquee-box">
                <div class="marquee-track">
                    <div class="frame"><img src="IMG_20260901_200944_844.jpg"></div>
                    <div class="frame"><img src="IMG_20260901_200957_131.jpg"></div>
                    <div class="frame"><img src="IMG_20260901_200959_442.jpg"></div>
                    <div class="frame"><img src="IMG_20260901_201005_331.jpg"></div>
                    <div class="frame"><img src="IMG_20260901_201042_428.jpg"></div>
                    <!-- Duplicate for infinite loop -->
                    <div class="frame"><img src="IMG_20260901_200944_844.jpg"></div>
                    <div class="frame"><img src="IMG_20260901_200957_131.jpg"></div>
                    <div class="frame"><img src="IMG_20260901_200959_442.jpg"></div>
                    <div class="frame"><img src="IMG_20260901_201005_331.jpg"></div>
                    <div class="frame"><img src="IMG_20260901_201042_428.jpg"></div>
                </div>
            </div>
        </div>

        <!-- Polaroid Highlights -->
        <div class="section-box">
            <div class="tape"></div>
            <div class="polaroid" style="--r: -2deg;">
                <img src="IMG_20260901_201044_865.jpg">
                <div class="polaroid-text">Wonderful Memories 🌸</div>
            </div>
            <div class="polaroid" style="--r: 2deg;">
                <img src="IMG_20260901_201054_818.jpg">
                <div class="polaroid-text">Always Glowing ✨</div>
            </div>
            <div class="polaroid" style="--r: -1.5deg;">
                <img src="IMG_20260901_201059_484.jpg">
                <div class="polaroid-text">Stay Amazing! 💖</div>
            </div>
        </div>

        <!-- Final Greeting -->
        <div class="section-box">
            <div class="tape"></div>
            <h2 style="font-family: 'Caveat', cursive; font-size: 34px; color: #be123c;">Have A Blessed Year! 👑</h2>
            <div class="polaroid" style="--r: 0deg;">
                <img src="Screenshot_2026-09-01-20-10-20-633_com.instagram.android-edit.jpg">
                <div class="polaroid-text">Polina ✨</div>
            </div>
        </div>

    </div>

    <!-- Audio Element -->
    <audio id="mySong" src="Buck Owens - Made In Japan (sped up) [HeRjqQeu5NF].mp3" loop></audio>

    <script>
        function openBirthdayPage() {
            var audio = document.getElementById('mySong');
            audio.play().catch(function(error) {
                console.log("Playback failed:", error);
            });
            
            var gate = document.getElementById('startGate');
            gate.style.display = 'none';
        }
    </script>
</body>
</html>
